services:
  knowledge-dump:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-dump-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
